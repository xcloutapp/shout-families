name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove who it is to Google, no stored key needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/8675342569/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@shout-families.iam.gserviceaccount.com
      - name: Deploy notification functions
        id: functions
        continue-on-error: true
        run: npx --yes firebase-tools@latest deploy --only functions --project shout-families --non-interactive --force
      - name: Deploy app and database rules
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project shout-families --non-interactive
      - name: Functions deploy failed
        if: steps.functions.outcome == 'failure'
        run: echo "::warning::Notification functions did not deploy. See the 'Deploy notification functions' step." 
